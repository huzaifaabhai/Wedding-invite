[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/mehndi"
  to = "/mehndi.html"
  status = 200

[[redirects]]
  from = "/barat"
  to = "/barat.html"
  status = 200

[[redirects]]
  from = "/walima"
  to = "/walima.html"
  status = 200

[[redirects]]
  from = "/to/*"
  to = "/index.html"
  status = 200
